server:
  port: 8086

spring:
  application:
    name: job-manager-payment

  datasource:
    url: ${POSTGRES_PAYMENT_URL}
    username: ${POSTGRES_PAYMENT_USERNAME}
    password: ${POSTGRES_PAYMENT_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_your_stripe_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}

kafka:
  topic:
    payment-completed: payment.completed
    payment-failed: payment.failed
    payment-cancelled: payment.cancelled

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.devision.job_manager_payment: DEBUG
