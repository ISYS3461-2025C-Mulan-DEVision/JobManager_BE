# ========================================
# EC2-2: Core Application Plane
# Services: All Microservices
# Infrastructure: External (Upstash Redis, Neon PostgreSQL, External Kafka)
# ========================================

services:
    # ========================================
    # Application Services Layer
    # ========================================

    auth-service:
        image: ${DOCKERHUB_USERNAME}/jm-auth:${IMAGE_TAG:-latest}
        container_name: jm-auth-service
        restart: unless-stopped
        ports:
            - "8081:8081"
        env_file:
            - .env
        environment:
            SPRING_PROFILES_ACTIVE: docker
            EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EC2_1_PRIVATE_IP}:8761/eureka/
            SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-authdb}
            SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-authuser}
            SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-authpass}
            SPRING_REDIS_HOST: redis
            SPRING_REDIS_PORT: 6379
            SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
            OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}
        extra_hosts:
            - "kafka-mulan.duckdns.org:14.169.220.23"
        networks:
            - jm-core-network
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
            interval: 30s
            timeout: 10s
            retries: 5

