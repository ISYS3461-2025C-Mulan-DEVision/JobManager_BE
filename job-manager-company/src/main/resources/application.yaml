server:
  port: 8082

spring:
  application:
    name: job-manager-company
  
  datasource:
    url: jdbc:postgresql://localhost:5433/job_manager_company
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: company-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

firebase:
  project-id: devision-job-manager
  credentials-file: classpath:firebase-service-account.json
  bucket-name: devision-job-manager.firebasestorage.app

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: false
    fetch-registry: false
    register-with-eureka: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics