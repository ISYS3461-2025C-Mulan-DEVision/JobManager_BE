# ========================================
# Job Manager - Docker Compose
# ========================================
#
# Usage:
#   Build & Start all:     mvn clean package -DskipTests && docker compose up -d --build
#   Start all:             docker compose up -d
#   Stop all:              docker compose down
#   View logs:             docker compose logs -f [service-name]
#
# Endpoints:
#   Eureka Dashboard:      http://localhost:8761
#   API Gateway:           http://localhost:8080
#   Kafka UI:              http://localhost:8090
#
# Note: This setup uses cloud services for databases (Neon) and Redis (Upstash).
#       Only Kafka/Zookeeper run locally in Docker.
# ========================================

services:
  # ========================================
  # Kafka Infrastructure (DISABLED - Using Cloud Kafka)
  # Local Zookeeper, Kafka, and Kafka-UI services are disabled.
  # All services connect to cloud Kafka at kafka-mulan.duckdns.org:9092
  # ========================================

  # ========================================
  # Service Discovery (Eureka)
  # ========================================

  discovery-server:
    build:
      context: ./job-manager-discovery
      dockerfile: Dockerfile
    image: jm-discovery-server
    container_name: jm-discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - jm-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8761/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========================================
  # API Gateway
  # ========================================

  gateway:
    build:
      context: ./job-manager-gateway
      dockerfile: Dockerfile
    image: jm-gateway
    container_name: jm-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      GATEWAY_AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_started
    extra_hosts:
      - "kafka-mulan.duckdns.org:14.169.220.23"
    networks:
      - jm-network

  # ========================================
  # Application Services
  # ========================================

  auth-service:
    build:
      context: ./job-manager-auth
      dockerfile: Dockerfile
    image: jm-auth-service
    container_name: jm-auth-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      OAUTH2_REDIRECT_URI: http://localhost:8080/api/login/oauth2/code/google
    depends_on:
      discovery-server:
        condition: service_healthy
    extra_hosts:
      - "kafka-mulan.duckdns.org:14.169.220.23"
    networks:
      - jm-network

  company-service:
    build:
      context: ./job-manager-company
      dockerfile: Dockerfile
    image: jm-company-service
    container_name: jm-company-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      discovery-server:
        condition: service_healthy
    extra_hosts:
      - "kafka-mulan.duckdns.org:14.169.220.23"
    networks:
      - jm-network

  jobpost-service:
    build:
      context: ./job-manager-jobpost
      dockerfile: Dockerfile
