server:
  port: 8081

spring:
  application:
    name: job-manager-auth

  config:
    import: optional:dotenv:.env

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

#  datasource:
#    url: ${POSTGRES_AUTH_URL:jdbc:postgresql://localhost:5439/job_manager_auth}
#    username: ${POSTGRES_AUTH_USERNAME:postgres}
#    password: ${POSTGRES_AUTH_PASSWORD:postgres}
#    driver-class-name: org.postgresql.Driver

sharding:
  default-shard: auth_shard_others
  shards:
    auth_shard_vn:
      url: ${SHARD_VN_URL}
      username: ${NEON_USERNAME}
      password: ${NEON_PASSWORD}
      maximum-pool-size: 5
      minimum-idle: 1

    auth_shard_sg:
      url: ${SHARD_SG_URL}
      username: ${NEON_USERNAME}
      password: ${NEON_PASSWORD}
      maximum-pool-size: 5
      minimum-idle: 1

    auth_shard_asia:
      url: ${SHARD_ASIA_URL}
      username: ${NEON_USERNAME}
      password: ${NEON_PASSWORD}
      maximum-pool-size: 5
      minimum-idle: 1

    auth_shard_oceania:
      url: ${SHARD_OCEANIA_URL}
      username: ${NEON_USERNAME}
      password: ${NEON_PASSWORD}
      maximum-pool-size: 5
      minimum-idle: 1

    auth_shard_na:
      url: ${SHARD_NA_URL}
      username: ${NEON_USERNAME}
      password: ${NEON_PASSWORD}
      maximum-pool-size: 5
      minimum-idle: 1

    auth_shard_eu:
      url: ${SHARD_EU_URL}
      username: ${NEON_USERNAME}
      password: ${NEON_PASSWORD}
      maximum-pool-size: 5
      minimum-idle: 1

    auth_shard_others:
      url: ${SHARD_OTHERS_URL}
      username: ${NEON_USERNAME}
      password: ${NEON_PASSWORD}
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  base-url: http://localhost:8081
  frontend-url: http://localhost:5173
  activation:
    token-expiration: 86400000 # 24 hours

logging:
  level:
    com.devision.job_manager_auth.config.sharding: DEBUG
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG