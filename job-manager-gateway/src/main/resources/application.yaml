server:
  port: 8080

spring:
  application:
    name: job-manager-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Internal API Routes (for frontend/mobile apps)
        - id: auth-service
          uri: lb://job-manager-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
        
        - id: company-service
          uri: lb://job-manager-company
          predicates:
            - Path=/api/companies/**
          filters:
            - StripPrefix=0
        
        - id: jobpost-service
          uri: lb://job-manager-jobpost
          predicates:
            - Path=/api/job-posts/**
          filters:
            - StripPrefix=0
        
        - id: search-service
          uri: lb://job-manager-search
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=0
        
        - id: premium-service
          uri: lb://job-manager-premium
          predicates:
            - Path=/api/premium/**
          filters:
            - StripPrefix=0
        
        - id: payment-service
          uri: lb://job-manager-payment
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=0
        
        - id: notification-service
          uri: lb://job-manager-notification
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0
        
        # External API Routes (for inter-service communication)
        - id: auth-external-service
          uri: lb://job-manager-auth
          predicates:
            - Path=/api/external/companies/**
          filters:
            - StripPrefix=0
        
        - id: jobpost-external-service
          uri: lb://job-manager-jobpost
          predicates:
            - Path=/api/external/job-posts/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway