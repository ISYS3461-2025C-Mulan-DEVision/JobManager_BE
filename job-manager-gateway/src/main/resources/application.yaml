server:
  port: 8080

spring:
  application:
    name: job-manager-gateway

  config:
    import: optional:dotenv:.env

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      # Global CORS configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:5175"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            exposedHeaders:
              - "Authorization"

      # Route definitions for reactive gateway
