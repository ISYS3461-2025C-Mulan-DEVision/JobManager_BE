server:
  port: 8086

spring:
  application:
    name: job-manager-payment

  datasource:
    url: ${POSTGRES_PAYMENT_URL:jdbc:postgresql://localhost:5437/job_manager_payment}
    username: ${POSTGRES_PAYMENT_USERNAME:postgres}
    password: ${POSTGRES_PAYMENT_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_your_stripe_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics