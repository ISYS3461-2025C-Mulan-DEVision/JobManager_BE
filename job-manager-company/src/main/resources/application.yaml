server:
  port: 8082

spring:
  application:
    name: job-manager-company

  datasource:
    url: ${POSTGRES_COMPANY_URL:jdbc:postgresql://localhost:5433/job_manager_company}
    username: ${POSTGRES_COMPANY_USERNAME:postgres}
    password: ${POSTGRES_COMPANY_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: company-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

firebase:
  project-id: devision-job-manager
  credentials-file: classpath:firebase-service-account.json
  bucket-name: devision-job-manager.firebasestorage.app

# JWT configuration - must match job-manager-auth settings
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics