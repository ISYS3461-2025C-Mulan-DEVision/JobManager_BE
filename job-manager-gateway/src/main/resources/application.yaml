server:
  port: 8080

spring:
  application:
    name: job-manager-gateway
    # Note: Gateway routes are configured in GatewayConfig.java for MVC Gateway
    # YAML-based configuration is for reactive gateway only

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
