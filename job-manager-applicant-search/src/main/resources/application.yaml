server:
  port: 8084

spring:
  application:
    name: job-manager-applicant-search

  datasource:
    url: ${POSTGRES_APPLICANT_SEARCH_URL:jdbc:postgresql://localhost:5435/job_manager_applicant_search}
    username: ${POSTGRES_APPLICANT_SEARCH_USERNAME:postgres}
    password: ${POSTGRES_APPLICANT_SEARCH_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      # Use URL format for flexibility (supports both local and cloud Redis)
      # Local: redis://localhost:6379
      # Upstash: rediss://:password@host:port
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: applicant-search-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# External service URLs
subscription:
  service:
    url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8085}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics